ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride None
</Directory>

# Las respuestas de PHP envían sus cabeceras desde Bootstrap; aquí solo los estáticos.
<FilesMatch "\.(css|js|json|svg|png|ico|woff2?)$">
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set Referrer-Policy "no-referrer"
    Header set Content-Security-Policy "default-src 'self'"
</FilesMatch>
